<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | اتوگالری پرشیا</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0A1628;--navy2:#1A2F4A;--gold:#D4AF37;--gold2:#B8941F;--white:#fff;--gray:#8A94A6;--off:#F4F6F9;--green:#2ECC71;--red:#E74C3C;--shadow:0 20px 50px rgba(10,22,40,.15)}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--off);color:#1A1A2E;line-height:1.9;direction:rtl}
button{font-family:inherit;cursor:pointer;border:none}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--navy2));padding:20px}
.login-box{background:var(--white);border-radius:25px;padding:50px 40px;max-width:420px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.login-logo{text-align:center;margin-bottom:30px}
.login-logo-icon{font-size:3rem;margin-bottom:15px;display:block}
.login-logo h1{font-size:1.5rem;color:var(--navy);font-weight:800}
.login-logo h1 span{color:var(--gold)}
.login-logo p{color:var(--gray);font-size:.9rem;margin-top:5px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-weight:600;color:var(--navy);margin-bottom:8px;font-size:.9rem}
.form-group input,.form-group select{width:100%;padding:14px 18px;border:2px solid rgba(10,22,40,.1);border-radius:12px;font-family:inherit;font-size:.95rem;background:var(--off);outline:none;transition:.3s;color:var(--navy)}
.form-group input:focus,.form-group select:focus{border-color:var(--gold);background:var(--white)}
.btn-login{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);padding:16px;border-radius:12px;font-weight:800;font-size:1rem;transition:.3s}
.btn-login:hover{transform:translateY(-3px);box-shadow:0 15px 40px rgba(212,175,55,.4)}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}
.login-error{background:#FEE;color:var(--red);padding:12px;border-radius:10px;font-size:.85rem;text-align:center;margin-top:15px;display:none}
.login-error.show{display:block}
.admin-panel{display:none;min-height:100vh}
.admin-panel.show{display:block}
.admin-header{background:var(--navy);color:var(--white);padding:20px 0;position:sticky;top:0;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.admin-header-inner{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.admin-logo{display:flex;align-items:center;gap:10px;font-size:1.2rem;font-weight:800}
.admin-logo span{color:var(--gold)}
.admin-user{display:flex;align-items:center;gap:15px;font-size:.9rem}
.admin-user-email{color:rgba(255,255,255,.7);font-size:.85rem}
.btn-logout{background:rgba(231,76,60,.2);color:#FF6B6B;padding:8px 18px;border-radius:50px;font-weight:600;font-size:.85rem;transition:.3s}
.btn-logout:hover{background:var(--red);color:var(--white)}
.admin-content{max-width:1200px;margin:0 auto;padding:30px 20px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:30px}
.stat-card{background:var(--white);border-radius:20px;padding:25px;box-shadow:0 5px 20px rgba(10,22,40,.05);display:flex;align-items:center;gap:15px}
.stat-icon{width:60px;height:60px;border-radius:15px;background:linear-gradient(135deg,var(--navy),var(--navy2));display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--gold);flex-shrink:0}
.stat-info h3{font-size:1.8rem;font-weight:900;color:var(--navy);line-height:1}
.stat-info p{font-size:.85rem;color:var(--gray);margin-top:5px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:12px;font-weight:700;font-size:.9rem;transition:.3s}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy)}
.btn-gold:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(212,175,55,.4)}
.btn-red{background:var(--red);color:var(--white)}
.btn-red:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(231,76,60,.3)}
.btn-gray{background:var(--off);color:var(--navy)}
.btn-gray:hover{background:#E5E9F0}
.btn-sm{padding:8px 15px;font-size:.8rem}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;flex-wrap:wrap;gap:15px}
.toolbar h2{color:var(--navy);font-size:1.3rem;font-weight:800}
.cars-list{display:grid;gap:15px}
.car-item{background:var(--white);border-radius:20px;padding:20px;box-shadow:0 5px 20px rgba(10,22,40,.05);display:grid;grid-template-columns:80px 1fr auto;gap:20px;align-items:center;transition:.3s}
.car-item:hover{box-shadow:0 15px 40px rgba(10,22,40,.1)}
.car-item-image{width:80px;height:80px;border-radius:15px;background:linear-gradient(135deg,var(--navy),var(--navy2));display:flex;align-items:center;justify-content:center;font-size:2rem;overflow:hidden}
.car-item-image img{width:100%;height:100%;object-fit:cover}
.car-item-info h3{color:var(--navy);font-size:1rem;font-weight:800;margin-bottom:5px}
.car-item-info p{color:var(--gray);font-size:.85rem}
.car-item-info .price{color:var(--gold);font-weight:800;font-size:1rem;margin-top:5px}
.car-item-actions{display:flex;gap:8px}
.empty-state{text-align:center;padding:60px 20px;background:var(--white);border-radius:20px}
.empty-state i{font-size:4rem;color:var(--gray);opacity:.3;margin-bottom:15px}
.empty-state h3{color:var(--navy);margin-bottom:8px}
.empty-state p{color:var(--gray);font-size:.9rem}
.modal{position:fixed;inset:0;background:rgba(10,22,40,.8);backdrop-filter:blur(5px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal.show{display:flex}
.modal-content{background:var(--white);border-radius:25px;padding:35px;max-width:550px;width:100%;max-height:90vh;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.modal-header h2{color:var(--navy);font-size:1.3rem;font-weight:800}
.modal-close{background:var(--off);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:1.2rem;transition:.3s}
.modal-close:hover{background:var(--red);color:var(--white)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.modal-actions{display:flex;gap:10px;margin-top:25px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--navy);color:var(--white);padding:15px 30px;border-radius:50px;font-weight:600;font-size:.9rem;box-shadow:0 20px 50px rgba(0,0,0,.3);transition:.3s;z-index:2000;display:flex;align-items:center;gap:10px}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.loading{text-align:center;padding:60px}
.loading i{font-size:2.5rem;color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:600px){
.car-item{grid-template-columns:70px 1fr;gap:15px}
.car-item-actions{grid-column:1/-1;justify-content:flex-end}
.form-row{grid-template-columns:1fr}
.login-box{padding:35px 25px}
.modal-content{padding:25px}
}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
<div class="login-box">
<div class="login-logo">
<span class="login-logo-icon">🏎️</span>
<h1>اتوگالری <span>پرشیا</span></h1>
<p>پنل مدیریت</p>
</div>
<form id="loginForm">
<div class="form-group">
<label>ایمیل</label>
<input type="email" id="loginEmail" placeholder="admin@persia.com" required>
</div>
<div class="form-group">
<label>رمز عبور</label>
<input type="password" id="loginPassword" placeholder="••••••••" required>
</div>
<button type="submit" class="btn-login" id="loginBtn">
<i class="fas fa-sign-in-alt"></i> ورود به پنل
</button>
<div class="login-error" id="loginError"></div>
</form>
</div>
</div>

<div class="admin-panel" id="adminPanel">
<header class="admin-header">
<div class="admin-header-inner">
<div class="admin-logo">🏎️ اتوگالری <span>پرشیا</span></div>
<div class="admin-user">
<span class="admin-user-email" id="userEmail"></span>
<button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> خروج</button>
</div>
</div>
</header>

<div class="admin-content">
<div class="stats-grid">
<div class="stat-card">
<div class="stat-icon"><i class="fas fa-car"></i></div>
<div class="stat-info"><h3 id="totalCars">۰</h3><p>کل خودروها</p></div>
</div>
<div class="stat-card">
<div class="stat-icon" style="background:linear-gradient(135deg,#2ECC71,#27AE60)"><i class="fas fa-check-circle"></i></div>
<div class="stat-info"><h3 id="newCars">۰</h3><p>صفر</p></div>
</div>
<div class="stat-card">
<div class="stat-icon" style="background:linear-gradient(135deg,#3498DB,#2980B9)"><i class="fas fa-history"></i></div>
<div class="stat-info"><h3 id="usedCars">۰</h3><p>کارکرده</p></div>
</div>
</div>

<div class="toolbar">
<h2>📋 لیست خودروها</h2>
<button class="btn btn-gold" id="addCarBtn"><i class="fas fa-plus"></i> افزودن خودرو</button>
</div>

<div class="cars-list" id="carsList">
<div class="loading"><i class="fas fa-spinner"></i><p style="margin-top:15px;color:var(--gray)">در حال بارگذاری...</p></div>
</div>
</div>
</div>

<div class="modal" id="carModal">
<div class="modal-content">
<div class="modal-header">
<h2 id="modalTitle">افزودن خودرو</h2>
<button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
</div>
<form id="carForm">
<input type="hidden" id="carId">
<div class="form-group">
<label>نام خودرو *</label>
<input type="text" id="carName" placeholder="مثلاً: بنز S500" required>
</div>
<div class="form-row">
<div class="form-group">
<label>برند *</label>
<select id="carBrand" required>
<option value="benz">بنز</option>
<option value="bmw">بی‌ام‌و</option>
<option value="audi">آئودی</option>
<option value="toyota">تویوتا</option>
<option value="hyundai">هیوندای</option>
<option value="other">سایر</option>
</select>
</div>
<div class="form-group">
<label>وضعیت *</label>
<select id="carStatus" required>
<option value="new">صفر</option>
<option value="used">کارکرده</option>
</select>
</div>
</div>
<div class="form-row">
<div class="form-group"><label>سال تولید</label><input type="text" id="carYear" placeholder="۱۴۰۲"></div>
<div class="form-group"><label>کارکرد (کیلومتر)</label><input type="number" id="carKm" placeholder="0"></div>
</div>
<div class="form-row">
<div class="form-group"><label>رنگ</label><input type="text" id="carColor" placeholder="مشکی"></div>
<div class="form-group"><label>قیمت (تومان) *</label><input type="number" id="carPrice" placeholder="10000000000" required></div>
</div>
<div class="form-group">
<label>📸 انتخاب عکس از گالری</label>
<input type="file" id="carImageFile" accept="image/*" style="width:100%;padding:12px 15px;border:2px solid rgba(10,22,40,.1);border-radius:12px;font-family:inherit;font-size:.9rem;background:var(--off);color:var(--navy)">
<div id="imagePreview" style="margin-top:12px;display:none;text-align:center">
<img id="previewImg" style="max-width:100%;max-height:200px;border-radius:12px;box-shadow:0 5px 20px rgba(10,22,40,.15)">
<button type="button" id="removeImage" style="display:block;margin:10px auto 0;background:var(--red);color:white;padding:6px 15px;border-radius:50px;font-size:.8rem;font-weight:600">حذف عکس</button>
</div>
<input type="hidden" id="carImage" value="">
</div>
<div class="modal-actions">
<button type="submit" class="btn btn-gold" style="flex:1;justify-content:center" id="saveCarBtn"><i class="fas fa-save"></i> ذخیره</button>
<button type="button" class="btn btn-gray" id="cancelBtn">انصراف</button>
</div>
</form>
</div>
</div>

<div class="toast" id="toast">
<i class="fas fa-check-circle"></i>
<span id="toastText"></span>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAZA0hCoIyfRadKlSYYl48vUkNsAjByd-I",
  authDomain: "persia-gallery.firebaseapp.com",
  projectId: "persia-gallery",
  storageBucket: "persia-gallery.firebasestorage.app",
  messagingSenderId: "53718146976",
  appId: "1:53718146976:web:4c3ebc177c9598b37f4ec5",
  measurementId: "G-NK13W6BJNR"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginScreen = document.getElementById('loginScreen');
const adminPanel = document.getElementById('adminPanel');
const loginForm = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');
const loginBtn = document.getElementById('loginBtn');
const userEmail = document.getElementById('userEmail');
const logoutBtn = document.getElementById('logoutBtn');
const carsList = document.getElementById('carsList');
const carModal = document.getElementById('carModal');
const carForm = document.getElementById('carForm');
const modalTitle = document.getElementById('modalTitle');
const addCarBtn = document.getElementById('addCarBtn');
const modalClose = document.getElementById('modalClose');
const cancelBtn = document.getElementById('cancelBtn');
const toast = document.getElementById('toast');
const toastText = document.getElementById('toastText');

let allCars = [];
let editingId = null;
let imageBase64 = '';

function showToast(msg, type = 'success') {
  toastText.textContent = msg;
  toast.className = 'toast show ' + type;
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function formatPrice(num) {
  return Number(num).toLocaleString('fa-IR');
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginBtn.disabled = true;
  loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال ورود...';
  loginError.classList.remove('show');

  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    showToast('✅ خوش آمدید!', 'success');
  } catch (err) {
    console.error(err);
    let msg = 'خطا: ' + (err.code || err.message || 'نامشخص');
    if (err.code === 'auth/user-not-found') msg = 'کاربر پیدا نشد';
    if (err.code === 'auth/wrong-password') msg = 'رمز عبور اشتباهه';
    if (err.code === 'auth/invalid-credential') msg = 'ایمیل یا رمز اشتباهه';
    if (err.code === 'auth/invalid-email') msg = 'ایمیل نامعتبره';
    if (err.code === 'auth/network-request-failed') msg = 'خطای شبکه - فیلترشکن رو روشن کن';
    loginError.textContent = msg;
    loginError.classList.add('show');
  } finally {
    loginBtn.disabled = false;
    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> ورود به پنل';
  }
});

logoutBtn.addEventListener('click', async () => {
  await signOut(auth);
  showToast('خارج شدید', 'success');
});

onAuthStateChanged(auth, (user) => {
  if (user) {
    loginScreen.style.display = 'none';
    adminPanel.classList.add('show');
    userEmail.textContent = user.email;
    loadCars();
  } else {
    loginScreen.style.display = 'flex';
    adminPanel.classList.remove('show');
  }
});

async function loadCars() {
  carsList.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><p style="margin-top:15px;color:var(--gray)">در حال بارگذاری...</p></div>';
  try {
    const q = query(collection(db, 'cars'), orderBy('createdAt', 'desc'));
    const snapshot = await getDocs(q);
    allCars = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    renderCars();
    updateStats();
  } catch (err) {
    console.error(err);
    carsList.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>خطا در بارگذاری</h3><p>لطفاً دوباره تلاش کنید</p></div>';
  }
}

function updateStats() {
  document.getElementById('totalCars').textContent = formatPrice(allCars.length);
  document.getElementById('newCars').textContent = formatPrice(allCars.filter(c => c.status === 'new').length);
  document.getElementById('usedCars').textContent = formatPrice(allCars.filter(c => c.status === 'used').length);
}

function renderCars() {
  if (allCars.length === 0) {
    carsList.innerHTML = '<div class="empty-state"><i class="fas fa-car"></i><h3>هنوز خودرویی اضافه نکردی</h3><p>روی «افزودن خودرو» بزن و اولین ماشین رو اضافه کن</p></div>';
    return;
  }
  carsList.innerHTML = allCars.map(car => `
    <div class="car-item">
      <div class="car-item-image">${car.image ? `<img src="${car.image}" alt="${car.name}">` : '🚗'}</div>
      <div class="car-item-info">
        <h3>${car.name}</h3>
        <p>${car.year || '—'} • ${car.color || '—'} • ${car.km ? formatPrice(car.km) + ' km' : 'صفر'}</p>
        <div class="price">${formatPrice(car.price)} تومان</div>
      </div>
      <div class="car-item-actions">
        <button class="btn btn-gold btn-sm" onclick="editCar('${car.id}')"><i class="fas fa-edit"></i></button>
        <button class="btn btn-red btn-sm" onclick="deleteCar('${car.id}')"><i class="fas fa-trash"></i></button>
      </div>
    </div>
  `).join('');
}

addCarBtn.addEventListener('click', () => {
  editingId = null;
  modalTitle.textContent = 'افزودن خودرو';
  carForm.reset();
  imageBase64 = '';
  document.getElementById('imagePreview').style.display = 'none';
  document.getElementById('carImageFile').value = '';
  document.getElementById('carId').value = '';
  carModal.classList.add('show');
});

function closeModal() {
  carModal.classList.remove('show');
  carForm.reset();
  editingId = null;
  imageBase64 = '';
  document.getElementById('imagePreview').style.display = 'none';
  document.getElementById('carImageFile').value = '';
}
modalClose.addEventListener('click', closeModal);
cancelBtn.addEventListener('click', closeModal);

window.editCar = (id) => {
  const car = allCars.find(c => c.id === id);
  if (!car) return;
  editingId = id;
  modalTitle.textContent = 'ویرایش خودرو';
  document.getElementById('carId').value = id;
  document.getElementById('carName').value = car.name || '';
  document.getElementById('carBrand').value = car.brand || 'benz';
  document.getElementById('carStatus').value = car.status || 'new';
  document.getElementById('carYear').value = car.year || '';
  document.getElementById('carKm').value = car.km || '';
  document.getElementById('carColor').value = car.color || '';
  document.getElementById('carPrice').value = car.price || '';
  document.getElementById('carImage').value = car.image || '';
  imageBase64 = car.image || '';
  if (car.image) {
    document.getElementById('previewImg').src = car.image;
    document.getElementById('imagePreview').style.display = 'block';
  } else {
    document.getElementById('imagePreview').style.display = 'none';
  }
  document.getElementById('carImageFile').value = '';
  carModal.classList.add('show');
};

window.deleteCar = async (id) => {
  if (!confirm('مطمئنی می‌خوای حذف کنی؟')) return;
  try {
    await deleteDoc(doc(db, 'cars', id));
    showToast('✅ حذف شد', 'success');
    loadCars();
  } catch (err) {
    console.error(err);
    showToast('❌ خطا در حذف', 'error');
  }
};

document.getElementById('carImageFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 500 * 1024) {
    showToast('❌ عکس باید کمتر از ۵۰۰ کیلوبایت باشه', 'error');
    this.value = '';
